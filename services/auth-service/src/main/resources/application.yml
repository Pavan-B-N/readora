server:
  port: 8081

# Separate port from the main app — GatewaySecretFilter has no allowlist and would reject
# kubelet's probe outright on the main port; the management server runs as its own isolated
# context, bypassing UserContextFilter/JwtAuthenticationFilter/GatewaySecretFilter entirely.
management:
  server:
    port: 9081
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health

spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: auth-service

  datasource:
    url: ${POSTGRES_DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: auth
    show-sql: true

  flyway:
    schemas: auth
    baseline-on-migrate: true
    baseline-version: 1

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 30
  security:
    max-failed-login-attempts: 5
    public-routes:
      - /api/v1/auth/register
      - /api/v1/auth/login
      - /api/v1/auth/refresh
  gateway:
    secret: ${GATEWAY_SECRET}