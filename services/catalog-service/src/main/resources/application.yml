server:
  port: 8083

spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: catalog-service

  datasource:
    url: ${POSTGRES_DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: catalog
    show-sql: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

app:
  jwt:
    secret: ${JWT_SECRET}
  gateway:
    secret: ${GATEWAY_SECRET}
  commerce-service:
    base-url: http://localhost:8084
  user-service:
    base-url: http://localhost:8082
  storage:
    # Relative to this service's working directory when it starts (see run-all.sh).
    path: local-storage
  security:
    # Deliberately precise, not /api/v1/books/** — /api/v1/books/*/read (virtual-content
    # streaming) must stay authenticated so VirtualContentService can check ownership.
    public-routes:
      - /api/v1/books
      - /api/v1/books/*
      - /api/v1/books/*/related
      - /api/v1/categories/**
      - /api/v1/publishers/**
      - /api/v1/authors/**
      - /api/v1/stores/**
      - /internal/**
