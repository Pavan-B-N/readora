server:
  port: 8080

# Separate port from the main app — GatewaySecretFilter has no allowlist and would reject
# kubelet's probe outright on the main port; the management server runs as its own isolated
# context, bypassing UserContextFilter/JwtAuthenticationFilter/GatewaySecretFilter entirely.
management:
  server:
    port: 9080
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health

spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: api-gateway

  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**
        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/users/**
        - id: catalog-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/books/**,/api/v1/categories/**,/api/v1/publishers/**,/api/v1/authors/**,/api/v1/stores/**,/api/v1/admin/books/**,/api/v1/admin/categories/**,/api/v1/admin/publishers/**,/api/v1/admin/authors/**,/api/v1/admin/reviews/**
        - id: commerce-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/cart/**,/api/v1/orders/**,/api/v1/admin/orders/**
        - id: payment-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/payments/**
        - id: ai-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/v1/ai/**,/api/v1/admin/embeddings/**
        # SockJS negotiates over plain HTTP first (/ws/info, then falls back to xhr/xhr_streaming
        # session sub-paths if a raw WebSocket isn't available) before ever attempting an actual
        # WebSocket upgrade — a single ws://-scheme route can't proxy that plain-HTTP traffic at
        # all (Spring Cloud Gateway's WebSocket routing filter only handles real upgrade
        # requests), so this needs two routes: the raw-upgrade sub-path routed as ws://, matched
        # first since it's the more specific pattern, and everything else under /ws/** — the
        # negotiation and HTTP-fallback transports — routed as plain http://.
        # notification-service's own WebSocketConfig sets allowedOriginPatterns too (its SockJS
        # transports need real Origin validation, not just this gateway's), so both layers add
        # an Access-Control-Allow-Origin header to the same response — browsers reject a header
        # repeated with the same value just as readily as one with conflicting values, so this
        # needs deduping back down to one, not just correct on each layer individually.
        - id: notification-service-ws-upgrade
          uri: ws://localhost:8086
          predicates:
            - Path=/ws/*/*/websocket
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
        - id: notification-service-ws-sockjs
          uri: http://localhost:8086
          predicates:
            - Path=/ws/**
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
        - id: notification-service-rest
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/notifications/**
        - id: delivery-agent-service
          uri: http://localhost:8089
          predicates:
            - Path=/api/v1/delivery/**,/api/v1/returns/**,/api/v1/admin/delivery/**

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:5174"
              - "http://localhost:5175"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            exposedHeaders:
              - X-Conversation-Id
            allowCredentials: true

app:
  jwt:
    secret: ${JWT_SECRET}
  gateway:
    secret: ${GATEWAY_SECRET}
  security:
    public-routes:
      - /api/v1/auth/register
      - /api/v1/auth/login
      - /api/v1/auth/refresh
      - /api/v1/books
      - /api/v1/books/*
      - /api/v1/books/*/related
      # GET is public (catalog-service enforces the write-side auth itself via its own
      # public-get-routes — the gateway's own list has no per-method concept, so this
      # necessarily also lets an unauthenticated POST/DELETE through the gateway, same as
      # every other public-routes entry above).
      - /api/v1/books/*/reviews
      - /api/v1/categories/**
      - /api/v1/publishers/**
      - /api/v1/authors/**
      - /api/v1/stores/**
      - /api/v1/ai/search
      # SockJS negotiates its transport (the /ws/info polling requests, xhr-streaming, etc.)
      # over plain HTTP before a STOMP session exists, so it can't carry a Bearer token the way
      # a normal API call does — same reasoning as notification-service's own public-routes for
      # /ws/**. Real auth still happens: StompAuthChannelInterceptor rejects any CONNECT frame
      # without a valid JWT, just at the STOMP level, not here.
      - /ws/**
  rate-limit:
    default-rule:
      limit: 200
      window-seconds: 60
    rules:
      auth-service:
        limit: 200
        window-seconds: 60
      ai-service:
        limit: 20
        window-seconds: 60
