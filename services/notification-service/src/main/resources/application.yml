server:
  port: 8086

# Separate port from the main app — GatewaySecretFilter has no allowlist and would reject
# kubelet's probe outright on the main port; the management server runs as its own isolated
# context, bypassing UserContextFilter/JwtAuthenticationFilter/GatewaySecretFilter entirely.
management:
  server:
    port: 9086
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health

spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: notification-service

  datasource:
    url: ${POSTGRES_DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: notifications
    show-sql: true

  flyway:
    schemas: notifications
    baseline-on-migrate: true
    baseline-version: 1

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

app:
  jwt:
    secret: ${JWT_SECRET}
  gateway:
    secret: ${GATEWAY_SECRET}
  websocket:
    allowed-origins:
      - "http://localhost:5173"
      - "http://localhost:5174"
      # AKS deployment — see api-gateway's application.yml globalcors for the same list/reason.
      - "http://app.48-206-18-246.sslip.io"
      - "http://admin.48-206-18-246.sslip.io"
      - "http://delivery.48-206-18-246.sslip.io"
  security:
    # SockJS negotiates its transport (the /ws/info polling requests, xhr-streaming, etc.) over
    # plain HTTP before a STOMP session exists, so it can't carry a Bearer token the way a normal
    # API call does. That's fine: StompAuthChannelInterceptor independently rejects any CONNECT
    # frame without a valid JWT, so real auth still happens — just at the STOMP level, not here.
    public-routes:
      - /ws/**
