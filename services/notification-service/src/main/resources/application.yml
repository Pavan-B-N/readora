server:
  port: 8086

spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: notification-service

  datasource:
    url: ${POSTGRES_DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: notifications
    show-sql: true

  flyway:
    schemas: notifications
    baseline-on-migrate: true
    baseline-version: 1

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

app:
  jwt:
    secret: ${JWT_SECRET}
  gateway:
    secret: ${GATEWAY_SECRET}
  security:
    # SockJS negotiates its transport (the /ws/info polling requests, xhr-streaming, etc.) over
    # plain HTTP before a STOMP session exists, so it can't carry a Bearer token the way a normal
    # API call does. That's fine: StompAuthChannelInterceptor independently rejects any CONNECT
    # frame without a valid JWT, so real auth still happens — just at the STOMP level, not here.
    public-routes:
      - /ws/**
