server:
  port: 8088

spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: ai-service

  datasource:
    url: ${POSTGRES_DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: ai
    show-sql: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ai-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  ai:
    azure:
      openai:
        endpoint: ${AZURE_OPENAI_ENDPOINT}
        api-key: ${AZURE_OPENAI_API_KEY}
        chat:
          options:
            deployment-name: ${AZURE_OPENAI_CHAT_DEPLOYMENT}
        embedding:
          options:
            deployment-name: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT}
            # ada-002 rejects the `dimensions` param outright (400 "This model does not support
            # specifying dimensions"), even set to its own native size — only text-embedding-3-*
            # models support it. Leave unset for ada-002; vectorstore.pgvector.dimensions below
            # (1536, ada-002's native output) is what actually sizes the pgvector column.

    vectorstore:
      pgvector:
        schema-name: ai
        table-name: vector_store
        dimensions: 1536
        initialize-schema: true

    mcp:
      client:
        streamable-http:
          url: ${MCP_SERVER_URL:http://localhost:8087}

app:
  gateway:
    secret: ${GATEWAY_SECRET}
  security:
    public-routes:
      - /api/v1/ai/search
  catalog-service:
    base-url: http://localhost:8083
