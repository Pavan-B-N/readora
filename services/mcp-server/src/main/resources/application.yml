server:
  port: 8087

# Separate port from the main app — GatewaySecretFilter has no allowlist and would reject
# kubelet's probe outright on the main port; the management server runs as its own isolated
# context, bypassing UserContextFilter/JwtAuthenticationFilter/GatewaySecretFilter entirely.
management:
  server:
    port: 9087
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health

spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: mcp-server

  # Unverified property names — check against the spring-ai-starter-mcp-server-webmvc reference
  # docs when you sync; this is the intended shape as of Spring AI 1.0.
  ai:
    mcp:
      server:
        name: readora-mcp-server
        version: 1.0.0

app:
  jwt:
    secret: ${JWT_SECRET}
  gateway:
    secret: ${GATEWAY_SECRET}
  catalog-service:
    base-url: http://localhost:8083
  commerce-service:
    base-url: http://localhost:8084
  user-service:
    base-url: http://localhost:8082
