server:
  port: 8089

# /actuator/health is allowlisted in GatewaySecretFilter and UserContextFilter, so it's
# safe to expose on the main app port rather than a separate management port.
management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health

spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: delivery-agent-service

  datasource:
    url: ${POSTGRES_DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: delivery
    show-sql: true

  flyway:
    schemas: delivery
    baseline-on-migrate: true
    baseline-version: 1

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: delivery-agent-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

app:
  jwt:
    secret: ${JWT_SECRET}
  gateway:
    secret: ${GATEWAY_SECRET}
  commerce-service:
    base-url: http://localhost:8084
  user-service:
    base-url: http://localhost:8082
  security:
    public-routes:
      - /internal/**
    role-gates:
      - path-prefix: /api/v1/delivery/
        role: DELIVERY_AGENT
      - path-prefix: /api/v1/returns/
        role: DELIVERY_AGENT
      - path-prefix: /api/v1/admin/
        role: ADMIN

resilience4j:
  timelimiter:
    instances:
      commerce-service:
        timeout-duration: 3s
      user-service:
        timeout-duration: 3s
  retry:
    instances:
      commerce-service:
        max-attempts: 3
        wait-duration: 500ms
      user-service:
        max-attempts: 3
        wait-duration: 500ms
  circuitbreaker:
    instances:
      commerce-service:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimum-number-of-calls: 5
        failure-rate-threshold: 100
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 1
        automatic-transition-from-open-to-half-open-enabled: true
      user-service:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimum-number-of-calls: 5
        failure-rate-threshold: 100
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 1
        automatic-transition-from-open-to-half-open-enabled: true
