services:
  # Infra Setup
  postgres:
    image: pgvector/pgvector:pg18 # Standard Postgres pre-packaged with the pgvector extension for AI embedding support.
    container_name: readora-postgres
    environment:
      POSTGRES_DB: readora
      POSTGRES_USER: readora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U readora -d readora"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [readora]

  redis:
    image: redis:7-alpine
    container_name: readora-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [readora]

  kafka:
    image: apache/kafka:3.8.0 # Runs modern Kafka in KRaft mode, eliminating the need for a separate ZooKeeper container.
    container_name: readora-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks: [readora]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    container_name: readora-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    environment:
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY}
    ports:
      - "4317:4317"
      - "4318:4318"
    networks: [readora]

  # Backend services
  auth-service:
    build:
      context: services
      dockerfile: auth-service/Dockerfile
    container_name: readora-auth-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_DB_URL: jdbc:postgresql://postgres:5432/readora
      POSTGRES_USER: readora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [readora]

  user-service:
    build:
      context: services
      dockerfile: user-service/Dockerfile
    container_name: readora-user-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_DB_URL: jdbc:postgresql://postgres:5432/readora
      POSTGRES_USER: readora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks: [readora]

  catalog-service:
    build:
      context: services
      dockerfile: catalog-service/Dockerfile
    container_name: readora-catalog-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_DB_URL: jdbc:postgresql://postgres:5432/readora
      POSTGRES_USER: readora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}
      AZURE_STORAGE_CONTAINER_NAME: ${AZURE_STORAGE_CONTAINER_NAME}
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks: [readora]

  commerce-service:
    build:
      context: services
      dockerfile: commerce-service/Dockerfile
    container_name: readora-commerce-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_DB_URL: jdbc:postgresql://postgres:5432/readora
      POSTGRES_USER: readora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      catalog-service:
        condition: service_started
      user-service:
        condition: service_started
      payment-service:
        condition: service_started
    networks: [readora]

  payment-service:
    build:
      context: services
      dockerfile: payment-service/Dockerfile
    container_name: readora-payment-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_DB_URL: jdbc:postgresql://postgres:5432/readora
      POSTGRES_USER: readora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks: [readora]

  notification-service:
    build:
      context: services
      dockerfile: notification-service/Dockerfile
    container_name: readora-notification-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_DB_URL: jdbc:postgresql://postgres:5432/readora
      POSTGRES_USER: readora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks: [readora]

  mcp-server:
    build:
      context: services
      dockerfile: mcp-server/Dockerfile
    container_name: readora-mcp-server
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
    ports:
      - "8087:8087"
    depends_on:
      catalog-service:
        condition: service_started
      commerce-service:
        condition: service_started
      user-service:
        condition: service_started
    networks: [readora]

  ai-service:
    build:
      context: services
      dockerfile: ai-service/Dockerfile
    container_name: readora-ai-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_DB_URL: jdbc:postgresql://postgres:5432/readora
      POSTGRES_USER: readora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      MCP_SERVER_URL: http://mcp-server:8087
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_CHAT_DEPLOYMENT: ${AZURE_OPENAI_CHAT_DEPLOYMENT}
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT}
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      mcp-server:
        condition: service_started
    networks: [readora]

  delivery-agent-service:
    build:
      context: services
      dockerfile: delivery-agent-service/Dockerfile
    container_name: readora-delivery-agent-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_DB_URL: jdbc:postgresql://postgres:5432/readora
      POSTGRES_USER: readora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
    ports:
      - "8089:8089"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      commerce-service:
        condition: service_started
      user-service:
        condition: service_started
    networks: [readora]

  api-gateway:
    build:
      context: services
      dockerfile: api-gateway/Dockerfile
    container_name: readora-api-gateway
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      catalog-service:
        condition: service_started
      commerce-service:
        condition: service_started
      payment-service:
        condition: service_started
      notification-service:
        condition: service_started
      ai-service:
        condition: service_started
      delivery-agent-service:
        condition: service_started
    networks: [readora]

  # Frontends
  frontend-user:
    build:
      # Build context is the workspace root — frontend-user depends on the shared-ui npm
      # workspace package, which Docker needs to see too (see frontend-user/Dockerfile).
      context: frontend
      dockerfile: frontend-user/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
    container_name: readora-frontend-user
    ports:
      - "5173:80"
    depends_on:
      api-gateway:
        condition: service_started
    networks: [readora]

  frontend-admin:
    build:
      context: frontend
      dockerfile: frontend-admin/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
    container_name: readora-frontend-admin
    ports:
      - "5174:80"
    depends_on:
      api-gateway:
        condition: service_started
    networks: [readora]

  frontend-delivery-agent:
    build:
      context: frontend
      dockerfile: frontend-delivery-agent/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
    container_name: readora-frontend-delivery-agent
    ports:
      - "5175:80"
    depends_on:
      api-gateway:
        condition: service_started
    networks: [readora]

networks:
  readora:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
