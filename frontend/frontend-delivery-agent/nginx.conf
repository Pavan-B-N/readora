server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — client-side routing handles the actual 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # nginx's stock mime.types predates the .mjs extension convention, so it falls back to
    # application/octet-stream — browsers' strict module-script MIME checking then refuses to
    # load it as JS (breaks pdf.js's worker, and any other ES module shipped as .mjs).
    location ~ \.mjs$ {
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
