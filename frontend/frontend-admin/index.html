<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Readora Admin</title>
  </head>
  <body>
    <div id="root">
      <style>
        .app-preloader {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          gap: 16px;
          align-items: center;
          justify-content: center;
          background-color: #f7f7f8;
          z-index: 9999;
        }
        .app-preloader-spinner {
          width: 40px;
          height: 40px;
          border: 3px solid rgba(37, 99, 235, 0.2);
          border-top-color: #2563eb;
          border-radius: 50%;
          animation: app-preloader-spin 0.8s linear infinite;
        }
        .app-preloader-text {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          font-size: 14px;
          font-weight: 500;
          color: #6b7280;
        }
        @keyframes app-preloader-spin {
          to { transform: rotate(360deg); }
        }
      </style>
      <div class="app-preloader">
        <div class="app-preloader-spinner"></div>
        <div class="app-preloader-text">Loading Readora Admin...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
