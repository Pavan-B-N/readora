name: Frontend Delivery Agent CI/CD

on:
  # Trigger manually; push trigger can be enabled later for main branch changes.
  # push:
  #   branches: [main]
  #   paths:
  #     - "frontend/frontend-delivery-agent/**"
  #     - "frontend/shared-ui/**"
  #     - "frontend/package.json"
  #     - "frontend/package-lock.json"
  workflow_dispatch:

permissions:
  # Allow the workflow to commit and push Kubernetes manifest changes.
  contents: write
  # Declaring `permissions:` at all replaces every default with none, not just adds to
  # them — codeql-action/upload-sarif needs both of these (security-events to post SARIF
  # results, actions:read for the workflow-run lookup it makes internally).
  security-events: write
  actions: read

jobs:

  test:
    # Test phase: Install dependencies, type-check, and build the app.
    runs-on: ubuntu-latest

    steps:
      # Checkout phase: Download the repository source code onto the runner.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Node setup phase: Install Node.js 20 and configure npm dependency caching.
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Dependency install phase: Install the frontend workspace's npm dependencies.
      - name: Install workspace dependencies
        working-directory: frontend
        run: npm ci

      # Type-check phase: Verify frontend-delivery-agent compiles cleanly with no TypeScript errors.
      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit -p frontend-delivery-agent/tsconfig.json

      # Build phase: Produce frontend-delivery-agent's production build.
      - name: Build
        working-directory: frontend
        run: npm run build --workspace=frontend-delivery-agent


  build-and-push:
    # Build phase: Build the Docker image, push it to ACR, and scan it for vulnerabilities.
    needs: test
    runs-on: ubuntu-latest

    steps:
      # Checkout phase: Download the repository source code required for the Docker build.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Docker setup phase: Set up Docker Buildx for building the container image.
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Explicit, because setup-buildx-action doesn't always land on a builder that
          # supports GHA cache export (the plain "docker" driver silently doesn't).
          driver: docker-container

      # Registry login phase: Authenticate Docker with Azure Container Registry.
      - name: Login to Azure Container Registry
        # docker/login-action, not azure/docker-login — the latter overrides DOCKER_CONFIG,
        # which silently resets buildx back to the default (non-container) builder and
        # breaks GHA cache export ("Cache export is not supported for the docker driver").
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Docker build phase: Build the frontend-delivery-agent image and push it to ACR using the commit SHA as the tag.
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          # Build context is the whole frontend/ workspace root, not this app's own folder —
          # every app depends on the shared-ui workspace package, so Docker needs to see it too.
          context: ./frontend
          file: frontend/frontend-delivery-agent/Dockerfile
          push: true
          # Also load into the local Docker daemon — the docker-container buildx driver
          # (needed for GHA cache export) only pushes to the registry by default, and the
          # trivy scan step right after this needs a local copy to inspect.
          load: true
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_URL }}
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/readora-frontend-delivery-agent:${{ github.sha }}
          cache-from: type=gha,scope=frontend-delivery-agent
          cache-to: type=gha,mode=max,scope=frontend-delivery-agent

      # Security scan phase: Scan the pushed Docker image for HIGH and CRITICAL vulnerabilities.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: ${{ secrets.ACR_LOGIN_SERVER }}/readora-frontend-delivery-agent:${{ github.sha }}
          format: sarif
          output: trivy-frontend-delivery-agent.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      # Security reporting phase: Upload Trivy findings to GitHub Code Scanning.
      - name: Upload vulnerability results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-frontend-delivery-agent.sarif
          category: trivy-frontend-delivery-agent


  update-k8s-manifest:
    # Deployment phase: Update the Kubernetes image reference and push the change to Git.
    needs: build-and-push
    runs-on: ubuntu-latest

    # Concurrency phase: Serialize manifest updates so multiple service workflows do not push simultaneously.
    concurrency:
      group: k8s-manifest-update
      cancel-in-progress: false

    steps:
      # Checkout phase: Download the repository containing the Kubernetes manifests.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Kustomize setup phase: Install Kustomize so the Kubernetes image reference can be modified.
      - name: Install Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      # Manifest update phase: Change the frontend-delivery-agent Kubernetes image tag to the newly built Git SHA.
      - name: Update frontend-delivery-agent image tag
        working-directory: k8s/frontend-delivery-agent
        run: |
          kustomize edit set image \
            "${{ secrets.ACR_LOGIN_SERVER }}/readora-frontend-delivery-agent=${{ secrets.ACR_LOGIN_SERVER }}/readora-frontend-delivery-agent:${{ github.sha }}"

      # Git configuration phase: Configure the Git identity used by the GitHub Actions bot.
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # Staging phase: Stage the modified Kubernetes manifest for committing.
      - name: Stage manifest changes
        run: |
          git add k8s/frontend-delivery-agent/kustomization.yaml

      # Commit phase: Create a Git commit containing the updated Docker image tag.
      - name: Commit manifest changes
        run: |
          if git diff --cached --quiet; then
            echo "No image tag change to commit."
            exit 0
          fi
          git commit -m "chore(frontend-delivery-agent): update image tag to ${{ github.sha }} [skip ci]"

      # Push phase: Rebase and push the manifest commit, retrying when concurrent changes cause a push failure.
      - name: Push manifest changes
        run: |
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed, retrying..."
            sleep $(( (RANDOM % 5) + 1 ))
          done

          echo "Failed to push k8s manifest update after 5 attempts." >&2
          exit 1
