name: GitOps CI - Build, Push, and Update Manifests

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }} 
  ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
  ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
  IMAGE_TAG: ${{ github.sha }} 
  VITE_API_URL: http://your-live-api-gateway-ip:8080 

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ env.ACR_USERNAME }}
          password: ${{ env.ACR_PASSWORD }}

      # ==========================================
      # BACKEND SERVICES
      # ==========================================
      - name: Build & Push Auth Service
        run: |
          docker build -f services/auth-service/Dockerfile -t ${{ env.ACR_LOGIN_SERVER }}/readora-auth-service:${{ env.IMAGE_TAG }} ./services
          docker push ${{ env.ACR_LOGIN_SERVER }}/readora-auth-service:${{ env.IMAGE_TAG }}

      - name: Build & Push User Service
        run: |
          docker build -f services/user-service/Dockerfile -t ${{ env.ACR_LOGIN_SERVER }}/readora-user-service:${{ env.IMAGE_TAG }} ./services
          docker push ${{ env.ACR_LOGIN_SERVER }}/readora-user-service:${{ env.IMAGE_TAG }}

      - name: Build & Push Catalog Service
        run: |
          docker build -f services/catalog-service/Dockerfile -t ${{ env.ACR_LOGIN_SERVER }}/readora-catalog-service:${{ env.IMAGE_TAG }} ./services
          docker push ${{ env.ACR_LOGIN_SERVER }}/readora-catalog-service:${{ env.IMAGE_TAG }}

      - name: Build & Push Commerce Service
        run: |
          docker build -f services/commerce-service/Dockerfile -t ${{ env.ACR_LOGIN_SERVER }}/readora-commerce-service:${{ env.IMAGE_TAG }} ./services
          docker push ${{ env.ACR_LOGIN_SERVER }}/readora-commerce-service:${{ env.IMAGE_TAG }}

      - name: Build & Push Payment Service
        run: |
          docker build -f services/payment-service/Dockerfile -t ${{ env.ACR_LOGIN_SERVER }}/readora-payment-service:${{ env.IMAGE_TAG }} ./services
          docker push ${{ env.ACR_LOGIN_SERVER }}/readora-payment-service:${{ env.IMAGE_TAG }}

      - name: Build & Push Notification Service
        run: |
          docker build -f services/notification-service/Dockerfile -t ${{ env.ACR_LOGIN_SERVER }}/readora-notification-service:${{ env.IMAGE_TAG }} ./services
          docker push ${{ env.ACR_LOGIN_SERVER }}/readora-notification-service:${{ env.IMAGE_TAG }}

      - name: Build & Push MCP Server
        run: |
          docker build -f services/mcp-server/Dockerfile -t ${{ env.ACR_LOGIN_SERVER }}/readora-mcp-server:${{ env.IMAGE_TAG }} ./services
          docker push ${{ env.ACR_LOGIN_SERVER }}/readora-mcp-server:${{ env.IMAGE_TAG }}

      - name: Build & Push AI Service
        run: |
          docker build -f services/ai-service/Dockerfile -t ${{ env.ACR_LOGIN_SERVER }}/readora-ai-service:${{ env.IMAGE_TAG }} ./services
          docker push ${{ env.ACR_LOGIN_SERVER }}/readora-ai-service:${{ env.IMAGE_TAG }}

      - name: Build & Push Delivery Agent Service
        run: |
          docker build -f services/delivery-agent-service/Dockerfile -t ${{ env.ACR_LOGIN_SERVER }}/readora-delivery-agent-service:${{ env.IMAGE_TAG }} ./services
          docker push ${{ env.ACR_LOGIN_SERVER }}/readora-delivery-agent-service:${{ env.IMAGE_TAG }}

      - name: Build & Push API Gateway
        run: |
          docker build -f services/api-gateway/Dockerfile -t ${{ env.ACR_LOGIN_SERVER }}/readora-api-gateway:${{ env.IMAGE_TAG }} ./services
          docker push ${{ env.ACR_LOGIN_SERVER }}/readora-api-gateway:${{ env.IMAGE_TAG }}

      # ==========================================
      # FRONTEND SERVICES
      # ==========================================
      - name: Build & Push Frontend User
        run: |
          docker build --build-arg VITE_API_BASE_URL=${{ env.VITE_API_URL }} -f frontend/frontend-user/Dockerfile -t ${{ env.ACR_LOGIN_SERVER }}/readora-frontend-user:${{ env.IMAGE_TAG }} ./frontend/frontend-user
          docker push ${{ env.ACR_LOGIN_SERVER }}/readora-frontend-user:${{ env.IMAGE_TAG }}

      - name: Build & Push Frontend Admin
        run: |
          docker build --build-arg VITE_API_BASE_URL=${{ env.VITE_API_URL }} -f frontend/frontend-admin/Dockerfile -t ${{ env.ACR_LOGIN_SERVER }}/readora-frontend-admin:${{ env.IMAGE_TAG }} ./frontend/frontend-admin
          docker push ${{ env.ACR_LOGIN_SERVER }}/readora-frontend-admin:${{ env.IMAGE_TAG }}

      - name: Build & Push Frontend Delivery Agent
        run: |
          docker build --build-arg VITE_API_BASE_URL=${{ env.VITE_API_URL }} -f frontend/frontend-delivery-agent/Dockerfile -t ${{ env.ACR_LOGIN_SERVER }}/readora-frontend-delivery-agent:${{ env.IMAGE_TAG }} ./frontend/frontend-delivery-agent
          docker push ${{ env.ACR_LOGIN_SERVER }}/readora-frontend-delivery-agent:${{ env.IMAGE_TAG }}


  # ==========================================
  # GITOPS DEPLOYMENT (Update the YAML File)
  # ==========================================
  update-k8s-manifest:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Required to allow GitHub Actions to push commits back to the repo
          token: ${{ secrets.GITHUB_TOKEN }} 

      - name: Update Image Tags in Kubernetes Manifest
        run: |
          # This regex command searches for all 'readora-' images in the K8s file 
          # and seamlessly replaces the old tag with the new GitHub SHA tag.
          sed -i -E "s|(image: .*/readora-.*):.*|\1:${{ env.IMAGE_TAG }}|g" k8s/readora-complete.yaml

      - name: Commit and Push Changes to GitHub
        run: |
          # Set up Git bot configuration
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add the modified file and commit
          git add k8s/readora-complete.yaml
          git commit -m "chore: update K8s image tags to ${{ env.IMAGE_TAG }} [skip ci]"
          
          # Push the changes back to the main branch
          git push
