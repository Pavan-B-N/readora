name: MCP Server CI/CD

on:
# Manual trigger only — every rollout is a deliberate, audited action.
#   push:
#     branches: [main]
#     paths:
#       - "services/mcp-server/**"
#       - "services/shared-core/**"
#       - "services/pom.xml"
  workflow_dispatch:

permissions:
  contents: write # Allow the workflow to commit and push Kubernetes manifest changes.
  security-events: write
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Checkout phase: Download the repository source code onto the runner.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Java setup phase: Install Java 21 and configure Maven dependency caching.
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Maven test phase: Build mcp-server and its dependencies through the complete verify lifecycle.
      - name: Run tests + coverage gate
        working-directory: services
        run: mvn -B -pl mcp-server -am verify # -pl = project list, -B = batch, -am = --also-make


  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    steps:
      # Checkout phase: Download the repository source code required for the Docker build.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Otel agent phase: fetch and cache the OpenTelemetry Java agent once — the Dockerfile COPYs this local file instead of downloading it itself
      - name: Cache OpenTelemetry Java agent
        id: otel-agent-cache
        uses: actions/cache@v4
        with:
          path: services/artifacts/otel-agent.jar
          key: otel-agent-v2.31.1

      - name: Download OpenTelemetry Java agent
        if: steps.otel-agent-cache.outputs.cache-hit != 'true'
        run: |
          curl -fL --create-dirs -o services/artifacts/otel-agent.jar \
            https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/download/v2.31.1/opentelemetry-javaagent.jar

      # Docker setup phase: Set up Docker Buildx for building the container image.
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      # Registry login phase: Authenticate Docker with Azure Container Registry.
      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Docker build phase: Build the mcp-server image and push it to ACR using the commit SHA as the tag.
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./services
          file: services/mcp-server/Dockerfile
          push: true
          load: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/readora-mcp-server:${{ github.sha }}
          cache-from: type=gha,scope=mcp-server
          cache-to: type=gha,mode=max,scope=mcp-server

      # Security scan phase: Scan the pushed Docker image for HIGH and CRITICAL vulnerabilities.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: ${{ secrets.ACR_LOGIN_SERVER }}/readora-mcp-server:${{ github.sha }}
          format: sarif
          output: trivy-mcp-server.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      # Security reporting phase: Upload Trivy findings to GitHub Code Scanning.
      - name: Upload vulnerability results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-mcp-server.sarif
          category: trivy-mcp-server


  update-k8s-manifest:
    needs: build-and-push
    runs-on: ubuntu-latest

    # Concurrency phase: Serialize manifest updates so multiple service workflows do not push simultaneously.
    concurrency:
      group: k8s-manifest-update
      cancel-in-progress: false

    steps:
      # Checkout phase: Download the repository containing the Kubernetes manifests.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Kustomize setup phase: Install Kustomize so the Kubernetes image reference can be modified.
      - name: Install Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      # Manifest update phase: Change the mcp-server Kubernetes image tag to the newly built Git SHA.
      - name: Update mcp-server image tag
        working-directory: k8s/base/mcp-server
        run: |
          kustomize edit set image \
            "${{ secrets.ACR_LOGIN_SERVER }}/readora-mcp-server=${{ secrets.ACR_LOGIN_SERVER }}/readora-mcp-server:${{ github.sha }}"

      # Git configuration phase: Configure the Git identity used by the GitHub Actions bot.
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # Staging phase: Stage the modified Kubernetes manifest for committing.
      - name: Stage manifest changes
        run: |
          git add k8s/base/mcp-server/kustomization.yaml

      # Commit phase: Create a Git commit containing the updated Docker image tag.
      - name: Commit manifest changes
        run: |
          if git diff --cached --quiet; then
            echo "No image tag change to commit."
            exit 0
          fi
          git commit -m "chore(mcp-server): update image tag to ${{ github.sha }} [skip ci]"

      # Push phase: Rebase and push the manifest commit, retrying when concurrent changes cause a push failure.
      - name: Push manifest changes
        run: |
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed, retrying..."
            sleep $(( (RANDOM % 5) + 1 ))
          done

          echo "Failed to push k8s manifest update after 5 attempts." >&2
          exit 1
