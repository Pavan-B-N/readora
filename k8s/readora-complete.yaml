            - containerPort: 8088
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
spec:
  selector:
    app: ai-service
  ports:
    - port: 8088

# ==========================================
# FRONTEND SERVICES (Pulled from your private ACR)
# ==========================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-user
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-user
  template:
    metadata:
      labels:
        app: frontend-user
    spec:
      containers:
        - name: frontend-user
          image: myreadoraregistry.azurecr.io/readora-frontend-user:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-user
spec:
  type: LoadBalancer # Exposes your frontend to the internet!
  selector:
    app: frontend-user
  ports:
    - port: 80
      targetPort: 80
