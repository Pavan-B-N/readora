apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: readora
  labels:
    app: ai-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: readoracontainerregistry.azurecr.io/readora-ai-service:latest
          ports:
            - containerPort: 8088
            - containerPort: 9088
              name: management
          envFrom:
            - configMapRef:
                name: readora-config
            - secretRef:
                name: readora-secrets
          # httpGet against the separate management port — see application.yml for why it's isolated.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9088
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9088
            initialDelaySeconds: 45
            periodSeconds: 15
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 750m
              memory: 768Mi
          securityContext:
            runAsNonRoot: true
            # Explicit numeric UID — the image's USER is a name (spring), and kubelet
            # can't verify a non-numeric user is non-root without this (see the
            # Dockerfile's addgroup/adduser -u/-g 1000 pinning the same UID/GID).
            runAsUser: 1000
            allowPrivilegeEscalation: false
