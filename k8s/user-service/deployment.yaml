apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: readora
  labels:
    app: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: readoracontainerregistry.azurecr.io/readora-user-service:latest
          ports:
            - containerPort: 8082
            - containerPort: 9082
              name: management
          envFrom:
            - configMapRef:
                name: readora-config
            - secretRef:
                name: readora-secrets
          # httpGet against the separate management port — see application.yml for why it's isolated.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9082
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9082
            initialDelaySeconds: 45
            periodSeconds: 15
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 750m
              memory: 768Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
