apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: readora
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: myreadoraregistry.azurecr.io/readora-api-gateway:latest
          ports:
            - containerPort: 8080
            - containerPort: 9080
              name: management
          envFrom:
            - configMapRef:
                name: readora-config
            - secretRef:
                name: readora-secrets
          # httpGet against the separate management port — see application.yml for why it's isolated.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9080
            initialDelaySeconds: 45
            periodSeconds: 15
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 750m
              memory: 768Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
