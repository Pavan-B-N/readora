# Independent kustomization for just payment-service — requires `kubectl apply -k k8s/shared` first.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml

images:
  - name: myreadoraregistry.azurecr.io/readora-payment-service
    newTag: latest
