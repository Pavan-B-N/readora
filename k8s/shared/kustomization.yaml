# Cluster-wide + infra resources not owned by any per-service CI workflow — apply first: `kubectl apply -k k8s/shared`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - configmap.yaml
  - ingress.yaml
  - postgres/pvc.yaml
  - postgres/deployment.yaml
  - postgres/service.yaml
  - redis/pvc.yaml
  - redis/deployment.yaml
  - redis/service.yaml
  - kafka/pvc.yaml
  - kafka/deployment.yaml
  - kafka/service.yaml
  - otel-collector/configmap.yaml
  - otel-collector/deployment.yaml
  - otel-collector/service.yaml

# Generates the readora-secrets Secret from the gitignored .env.k8s (see .env.k8s.example).
secretGenerator:
  - name: readora-secrets
    envs:
      - .env.k8s

# Unhashed name required — the 13 service kustomizations reference "readora-secrets" by that literal name.
generatorOptions:
  disableNameSuffixHash: true
