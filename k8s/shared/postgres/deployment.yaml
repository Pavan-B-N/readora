apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: readora
  labels:
    app: postgres
spec:
  replicas: 1
  # Recreate, not RollingUpdate — a ReadWriteOnce PVC can't be mounted by two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg18
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "readora"
            - name: POSTGRES_USER
              value: "readora"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: readora-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "readora", "-d", "readora"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "readora", "-d", "readora"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
