# Mirrors infra/otel/otel-collector-config.yaml — embedded here since k8s has no bind-mount equivalent.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: readora
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch: {}

    exporters:
      otlphttp/newrelic:
        endpoint: https://otlp.nr-data.net
        headers:
          api-key: ${env:NEW_RELIC_LICENSE_KEY}

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlphttp/newrelic]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlphttp/newrelic]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlphttp/newrelic]
